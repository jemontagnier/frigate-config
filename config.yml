auth:
  reset_admin_password: false
  failed_login_rate_limit: 1/second;5/minute;20/hour
  trusted_proxies:
    - <ipaddress>

detectors:
  coral:
    type: edgetpu
    device: usb
    
mqtt:
  enabled: true
  host: <ipaddress>
  user: <user>
  password: <password>
  topic_prefix: frigate
  stats_interval: 60

ffmpeg:
  global_args: -hide_banner -loglevel warning
  hwaccel_args: preset-vaapi
  input_args: preset-rtsp-generic

birdseye:
  enabled: false

objects:
  track:
    #- car
    - person
    - cat
    - dog

review:
  alerts:
    labels:
      - car
      - person

snapshots:
  enabled: true
  timestamp: false
  bounding_box: true
  quality: 85
  retain:
    default: 2

motion:
  threshold: 30
  contour_area: 10
  lightning_threshold: 0.8
  improve_contrast: true

detect:
  enabled: true
  stationary:
    interval: 50
    threshold: 35

record:
  enabled: true
  alerts:
    retain:
      days: 5
    pre_capture: 8
    post_capture: 8
  detections:
    retain:
      days: 5
    pre_capture: 10
    post_capture: 8

  continuous:
    days: 0
  motion:
    days: 2
go2rtc:
  streams:
    exterieur1_raw:
      - rtsp://<user>:<password>@<ipaddress>/Streaming/Channels/101
    exterieur1_sub:
      - ffmpeg:exterieur1_raw#video=h264#width=1280#height=720#media=video#hardware=vaapi
    jardin1_raw:
      - rtsp://<user>:<password>@<ipaddress>:554/Streaming/Channels/101
    jardin1_sub:
      - rtsp://<user>:<password>@<ipaddress>:554/Streaming/Channels/102

cameras:
  exterieur1:
    enabled: true
    review:
      alerts:
        required_zones:
          - allee
          - terrasse
      detections:
        required_zones:
          - allee
          - terrasse
    snapshots:
      required_zones:
        - allee
        - terrasse
    objects:
      filters:
        person:
          min_score: 0.75
          mask: 0.853,0.27,0.902,0.26,0.9,0.509,0.881,0.516
        cat:
          min_ratio: 0
        dog:
          min_ratio: 0
    detect:
      fps: 5
      width: 1280
      height: 720
    ffmpeg:
      apple_compatibility: true
      inputs:
        - path: rtsp://127.0.0.1:8554/exterieur1_raw
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/exterieur1_sub
          roles:
            - detect
    motion:
      threshold: 25
      contour_area: 10
      improve_contrast: true
    zones:
      allee:
        coordinates:
          0.183,0.986,0.527,0.546,0.694,0.144,0.836,0.144,0.905,0.735,0.915,1
        loitering_time: 0
        inertia: 3
        objects:
          #- car
          - person
          - dog
          - cat
      terrasse:
        coordinates: 0.178,0.988,0.521,0.55,0.451,0.012,0.004,0.012,0,1
        loitering_time: 0
        objects:
          - cat
          - dog
          - person
        filters:
          person:
            min_ratio: 0.65
        inertia: 3
  interieur1:
    enabled: true
    objects:
      track:
        - person
    detect:
      fps: 5
      width: 1280
      height: 720
    ffmpeg:
      hwaccel_args: []
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4
                -reset_timestamps 1 -strftime 1 -c:v copy -an
      inputs:
        - path: rtsp://<user>:<password>@<ipaddress>:554/videoMain
          input_args: preset-rtsp-generic
          roles:
            - detect
            - record
  jardin:
    enabled: true
    review:
      alerts:
        required_zones:
          - zjardin
          - cuisine_ext
      detections:
        required_zones:
          - zjardin
          - cuisine_ext
    snapshots:
      required_zones:
        - zjardin
        - cuisine_ext
    objects:
      track:
        - person
        - cat
        - dog
        - bird
      #filters:
       # person:
        #  min_ratio: 0
    detect:
      fps: 5
      width: 640
      height: 360
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/jardin1_raw
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/jardin1_sub
          roles:
            - detect

    zones:
      cuisine_ext:
        coordinates: 0.067,0.828,0.7,0.432,0.987,0.64,0.998,0.997,0.002,0.996
        loitering_time: 0
        objects:
          - bird
          - cat
          - dog
      zjardin:
        coordinates:
          0.002,0.1,0.18,0.003,0.999,0,0.987,0.639,0.7,0.425,0.066,0.821,0,0.989
        loitering_time: 0
  garage:
    enabled: true
    objects:
      track:
        - person
      filters:
        person:
          min_area: 13000
          min_score: 0.3 # min score for object to initiate tracking (default: 0.5)
          threshold: 0.68 # min decimal percentage for tracked object's computed score to be considered a true positive (default: 0.7)
    detect:
      fps: 5
      width: 1280
      height: 720
    ffmpeg:
      inputs:
        - path: rtsp://<user>:<password>@<ipaddress>:554/live/ch0
          roles:
            - record
            - detect
version: 0.17-0
semantic_search:
  enabled: false
  reindex: false
  model_size: small